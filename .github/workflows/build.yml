name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      # Pinned to a known-good commit: newer screenpack versions use select.def syntax this engine version
      # does not understand yet. Change the SHA on purpose to upgrade.
      - name: Fetch the screenpack (game content)
        env:
          SCREENPACK_SHA: ab606f77ab85a344fb603a7bffd79935abdd8e89
        run: |
          mkdir "$RUNNER_TEMP/screenpack" && cd "$RUNNER_TEMP/screenpack"
          git init -q
          git remote add origin https://github.com/Ikemen-Engine/Ikemen_GO-Elecbyte-Screenpack
          git fetch -q --depth 1 origin "$SCREENPACK_SHA"
          git checkout -q FETCH_HEAD

      - name: Build
        run: bash web/build.sh "$RUNNER_TEMP/screenpack"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
